<!DOCTYPE html>
<html>

<head>

    <title>Profile</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>

<div id="profileContainer">

    <div class="profile-card">

        <img
            id="profileAvatar"
            class="profile-avatar"
            src="http://localhost:5000/uploads/default-avatar.png"
            alt="Profile Avatar">

        <input
            type="file"
            id="avatarInput"
            accept="image/*"
            hidden>

        <button id="changeAvatarBtn">
            Change Avatar
        </button>

        <h1 id="profileUsername"></h1>

        <p id="profileEmail"></p>

        <p id="profileJoined"></p>

    </div>

    <div class="profile-stats">

        <div class="stat-card">

            <h2 id="threadsCount">0</h2>

            <p>Threads</p>

        </div>

        <div class="stat-card">

            <h2 id="commentsCount">0</h2>

            <p>Comments</p>

        </div>

        <div class="stat-card">

            <h2 id="likesCount">0</h2>

            <p>Likes Received</p>

        </div>

        <div class="stat-card">

            <h2 id="bookmarksCount">0</h2>

            <p>Bookmarks</p>

        </div>

    </div>

    <div class="recent-threads">

        <h2>Recent Threads</h2>

        <div id="recentThreads"></div>

    </div>

</div>

<script src="auth.js"></script>
<script src="profile.js"></script>

</body>

</html>
