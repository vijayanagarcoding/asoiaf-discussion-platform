<!DOCTYPE html>
<html>

<head>
    <title>ASOIAF Discussion</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="book-header">

    <img
        id="bookCover"
        src="images/storm-of-swords.jpg"
        alt="Book Cover">

    <div class="book-info">

        <h1 id="bookTitle">
            A Storm of Swords
        </h1>

        <p id="bookAuthor">
            George R. R. Martin
        </p>

        <small id="bookStats">
    Loading...
</small>

    </div>

</div>

<div class="layout">

    <div class="left-panel">
<div class="search-box">

    <input
        type="text"
        id="chapterSearch"
        placeholder="Search...">

</div>
        <div id="chapters"></div>

        <div id="threads"></div>
<div class="search-box">
    <input
        type="text"
        id="threadSearch"
        placeholder="Search discussions...">
</div>
        <div id="createThread" style="display:none;">

            <h2>Create Thread</h2>

            <input
                type="text"
                id="threadTitle"
                placeholder="Enter thread title">

            <br><br>

            <textarea
                id="threadContent"
                rows="6"
                placeholder="Write your discussion..."></textarea>

            <br><br>

            <button id="createThreadBtn">
                Create Thread
            </button>

        </div>

    </div>

    <div class="right-panel">
<div id="welcomePanel">

    <div id="welcome">

    <h1>Welcome</h1>

    <p>Select a chapter from the left.</p>

    <p>Choose an existing discussion or create a new one.</p>

</div>
</div>
        <div id="selectedThread" style="display:none;">

            <div id="breadcrumb"></div>

<h2>Discussion</h2>

            <h3 id="selectedThreadTitle"></h3>

<p id="selectedThreadMeta"></p>

<hr>

<p id="selectedThreadContent"></p>
        </div>
<div class="search-box">

    <input
        type="text"
        id="commentSearch"
        placeholder="Search comments...">

</div>
        <div id="comments"></div>

        <div id="createComment" style="display:none;">

            <h2>Add Comment</h2>

            <textarea
                id="commentContent"
                rows="5"
                placeholder="Write your comment..."></textarea>

            <br><br>

            <button id="createCommentBtn">
                Post Comment
            </button>

        </div>

    </div>

</div>
<footer id="quoteFooter">

    <p id="quoteText"></p>

    <small id="quoteCharacter"></small>

</footer>
<script src="quotes.js"></script>



<script src="app.js"></script>

</body>

</html>
