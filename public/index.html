<!DOCTYPE html>
<html>

<head>
    <title>ASOIAF Discussion</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>


    <div class="book-header">

    <img
        id="bookCover"
        src="images/storm-of-swords.jpg"
        alt="Book Cover">

    <div class="book-info">

        <div id="userSection">

            <div id="currentUserInfo">

                <img
                    src="images/default-avatar.png"
                    class="avatar">

                <span id="currentUser"></span>

            </div>

            <button id="logoutBtn">
                Logout
            </button>

        </div>

        <div id="platformStats">

            <div class="stat-card">
                <span id="chapterCount">0</span>
                <small>Chapters</small>
            </div>

            <div class="stat-card">
                <span id="threadCount">0</span>
                <small>Threads</small>
            </div>

            <div class="stat-card">
                <span id="commentCount">0</span>
                <small>Comments</small>
            </div>

        </div>

        <h1 id="bookTitle">
            A Storm of Swords
        </h1>

        <p id="bookAuthor">
            George R. R. Martin
        </p>

        <small id="bookStats">
            Loading...
        </small>

    </div>

</div>

    <div class="layout">


    <div class="left-panel">

<div class="search-box">
    <button id="profileBtn">
    👤 Profile
</button>
<button id="viewBookmarksBtn">
    ⭐ My Bookmarks
</button>
<button id="themeToggle">🌙</button>
    <input
        type="text"
        id="chapterSearch"
        placeholder="Search...">

</div>
<div id="books"></div>

        <div id="chapters"></div>

        <div id="threads"></div>
        <div class="sort-container">

    <label for="threadSort">Sort:</label>

    <select id="threadSort">

        <option value="newest">Newest</option>

        <option value="oldest">Oldest</option>

        <option value="comments">Most Comments</option>

        <option value="title">Title (A-Z)</option>

    </select>

</div>
<div class="search-box">
    <input
        type="text"
        id="threadSearch"
        placeholder="Search discussions...">
</div>
        <div id="createThread" style="display:none;">

            <h2>Create Thread</h2>

            <input
                type="text"
                id="threadTitle"
                placeholder="Enter thread title">

            <br><br>

            <textarea
                id="threadContent"
                rows="6"
                placeholder="Write your discussion..."></textarea>

            <br><br>
<label for="threadCategory">Category</label>

<select id="threadCategory">

    <option>Theory</option>

    <option>Question</option>

    <option>Analysis</option>

    <option>Character</option>

    <option>Lore</option>

    <option>Prediction</option>

    <option>Discussion</option>

</select>

<br><br>
            <button id="createThreadBtn">
                Create Thread
            </button>

        </div>

    </div>

    <div class="right-panel">
<div id="welcomePanel">

    <div id="welcome">

    <h1>Welcome</h1>

    <p>Select a chapter from the left.</p>

    <p>Choose an existing discussion or create a new one.</p>

</div>
</div>
        <div id="selectedThread" style="display:none;">

            <div id="breadcrumb"></div>

<h2>Discussion</h2>

            <h3 id="selectedThreadTitle"></h3>

<p id="selectedThreadMeta"></p>

<hr>

<p id="selectedThreadContent"></p>
        </div>
<div class="search-box">

    <input
        type="text"
        id="commentSearch"
        placeholder="Search comments...">

</div>
        <div id="comments"></div>

        <div id="createComment" style="display:none;">

            <h2>Add Comment</h2>

            <textarea
                id="commentContent"
                rows="5"
                placeholder="Write your comment..."></textarea>

            <br><br>

            <button id="createCommentBtn">
                Post Comment
            </button>

        </div>

    </div>

</div>
<footer id="quoteFooter">

    <p id="quoteText"></p>

    <small id="quoteCharacter"></small>

</footer>
<div id="toast"></div>



<script src="theme.js"></script>
<script src="quotes.js"></script>

<script src="auth.js"></script>

<script src="app.js"></script>

</body>

</html>
