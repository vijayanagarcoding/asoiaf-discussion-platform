<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | ASOIAF Discussion</title>

    <link rel="stylesheet" href="login.css">

</head>

<body>

<div class="login-container">

    <h1>ASOIAF Discussion</h1>

    <h2>Register</h2>

    <form id="registerForm">

        <input
            type="text"
            id="username"
            placeholder="Username"
            required>

        <input
            type="email"
            id="email"
            placeholder="Email"
            required>

        <input
            type="password"
            id="password"
            placeholder="Password"
            required>

        <button type="submit">

            Register

        </button>

    </form>

    <p>

        Already have an account?

        <a href="login.html">

            Login

        </a>

    </p>

</div>

<script src="auth.js"></script>
<script src="theme.js"></script>
<script src="register.js"></script>

</body>

</html>
